<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Väderkoll – jämför prognoser</title>
<style>
  /* Färger: gran (ink), grönaktigt papper, status = gräs / raps / tegel */
  :root{
    --ink:#14332a; --paper:#f1f5ef; --sheet:#fbfcfa; --rule:#cfd9cf; --mute:#5a6e65;
    --good:#3e9b58; --ok:#eeb82e; --bad:#c9483c; --sea:#2c6e91;
    --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.45 var(--sans);background:var(--paper);color:var(--ink)}
  .app{max-width:820px;margin:0 auto;padding:14px 16px 44px}
  button,select,input{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0}
  :focus-visible{outline:3px solid var(--sea);outline-offset:2px}
  .small,.note{font-size:13px;color:var(--mute)}
  .note{margin:8px 0 0}
  [hidden]{display:none!important}

  /* Överkant: varumärke + plats + uppdatera */
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:4px 0 12px}
  .brand{display:block;font:700 11px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
  .place{font:600 24px/1.15 var(--serif);display:inline-flex;align-items:center;gap:6px;text-align:left;padding:2px 0}
  .place:hover{color:var(--sea)}
  .place .chev{font-size:13px;color:var(--mute);transition:transform .18s ease}
  .place[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .top-actions{display:flex;align-items:center;gap:8px}
  .icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);font-size:18px;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
  .icon:hover{background:#e6eee6;border-color:var(--ink)}
  .panel{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin:0 0 14px;box-shadow:0 4px 14px rgba(20,51,42,.06)}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .grow{flex:1;min-width:140px}
  input,select{padding:9px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet)}
  .btn{padding:8px 13px;border:1px solid var(--ink);border-radius:6px;font-weight:600;font-size:14px;background:var(--sheet);transition:background .15s}
  .btn:hover{background:#e6eee6}
  .btn.pri{background:var(--ink);color:var(--sheet)}
  .btn.pri:hover{background:#1e473b}
  .res button{display:block;width:100%;text-align:left;padding:9px 6px;border-bottom:1px solid var(--rule);border-radius:4px}
  .res button:hover{background:#e6eee6}

  /* Aktivitet */
  .acts{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 12px}
  .chip{padding:7px 14px;border:1px solid var(--ink);border-radius:999px;font-size:14.5px;background:var(--sheet);transition:background .15s,color .15s}
  .chip:hover{background:#e4eee4}
  .chip.on{background:var(--ink);color:var(--sheet)}
  .chip.plus{border-style:dashed;border-color:var(--mute);color:var(--mute);background:transparent}
  .chip.plus:hover{border-color:var(--ink);color:var(--ink);background:#e4eee4}
  .edit{border-top:1px solid var(--rule);padding:12px 0;margin-bottom:8px}
  .edit label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
  .edit input{width:100%}
  .edit .nm{max-width:280px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px;margin:10px 0}

  /* Svaret överst */
  .hero{display:flex;gap:14px;align-items:flex-start;padding:16px 0 18px;border-top:3px solid var(--ink)}
  .flagbox{color:var(--mute);flex:none;padding-top:4px}
  .flagbox.s0{color:var(--good)}.flagbox.s1{color:var(--ok)}.flagbox.s2{color:var(--bad)}
  .hq{margin:0;font-size:14.5px;color:var(--mute)}
  .hbig{margin:2px 0 6px;font:600 clamp(25px,6.2vw,35px)/1.14 var(--serif);letter-spacing:-.01em}
  .hsub{margin:0;font-size:14.5px;color:var(--mute);max-width:64ch}
  .hero-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .hero-acts .chip{font-size:13.5px;padding:5px 12px;font-weight:600}

  /* Filter */
  .filters{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--rule);font-size:14px;color:var(--mute)}
  .filters label{display:flex;gap:6px;align-items:center}
  .filters select{padding:6px 8px}
  .link{text-decoration:underline;text-underline-offset:3px;color:var(--ink);font-weight:600}
  .link .chev{font-size:12px}
  .filters.tcl{border-top:0;padding-top:0}

  /* Scorekortet */
  .sc{background:var(--sheet);border:1px solid var(--ink);border-radius:6px;padding:8px 10px 10px;box-shadow:0 2px 10px rgba(20,51,42,.05)}
  .drow{display:grid;grid-template-columns:66px 1fr;column-gap:10px;align-items:center;width:100%;text-align:left;padding:7px 6px;border-bottom:1px solid var(--rule);border-radius:4px;transition:background .12s}
  .drow:hover{background:#f3f7f2}
  .drow:last-child{border-bottom:0}
  .drow.head{padding:2px 6px 5px;border-bottom:1px solid var(--ink);border-radius:0}
  .drow.head:hover{background:none}
  .drow.sel{background:#e4eee4;box-shadow:inset 4px 0 0 var(--ink)}
  .dname{font:600 17px/1.1 var(--serif);font-variant-numeric:tabular-nums}
  .dname small{display:block;font:400 12px var(--sans);color:var(--mute);margin-top:2px}
  .strip{display:flex;gap:2.5px;min-width:0}
  .strip i{flex:1;min-width:0}
  .hrs i{font-style:normal;font-size:11px;color:var(--mute);text-align:center;height:auto;font-variant-numeric:tabular-nums}
  .h{display:block;height:30px;border-radius:3px;background:#dfe6df;position:relative;border-bottom:4px solid transparent;transition:transform .1s,box-shadow .1s}
  .drow:not(.head) .h:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(20,51,42,.18);z-index:2}
  .h.s0{background:var(--good)}
  .h.s1{background:var(--ok) radial-gradient(circle,rgba(20,51,42,.55) 1.1px,transparent 1.4px) 0 0/6px 6px}   /* gul = prickar (inte bara färg) */
  .h.s2{background:#d2594d repeating-linear-gradient(135deg,transparent 0 4px,rgba(255,255,255,.26) 4px 6px)}   /* mjukare röd, mönstret finns kvar */
  .h.na{background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}
  .h.r0{background:#e3eae3}.h.r1{background:#bcd7e6}.h.r2{background:#6ea6c6}.h.r3{background:var(--sea)}
  .h.best{border-bottom-color:var(--ink);box-shadow:inset 0 2px 0 rgba(20,51,42,.85)}
  .h.hsel{outline:2px solid var(--ink);outline-offset:1px;z-index:1}
  .h.snow::before{content:"❄";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.65)}
  .h.r0.snow::before,.h.r1.snow::before{color:var(--sea);text-shadow:none}
  .h.dis::after{content:"";position:absolute;top:-1px;left:50%;margin-left:-5px;border:5px solid transparent;border-top:7px solid #ff8a00;filter:drop-shadow(0 1px 0 #fff)}
  .legend .h.dis::after{top:2px}
  .dsum{grid-column:2;font-size:12.5px;color:var(--mute);margin-top:4px;font-variant-numeric:tabular-nums}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--mute)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend .h{width:16px;height:16px;flex:none;border-bottom-width:3px}
  .mini{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:6px;border-bottom:0}

  /* Dagsgraf (temperaturspann + nederbörd över dagen) */
  .dchart{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px 8px;margin:10px 0 14px}
  .dchart-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px;font-size:12.5px;color:var(--mute)}
  .dchart-leg{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .dchart-leg span{display:inline-flex;align-items:center;gap:5px}
  .dchart-leg i{display:inline-block;width:16px;height:2.5px;background:var(--ink)}
  .dchart-leg i.yr{background:var(--sea);border-bottom:2px dashed var(--sea);height:0}
  .dchart-leg i.dmi{background:#8c564b;border-bottom:2px dotted #8c564b;height:0}
  .dchart svg{display:block;width:100%;height:auto;overflow:visible}

  /* Timdetalj */
  .detail-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin:26px 0 8px}
  .detail-head h2{margin:0}
  h2{font:600 21px/1.2 var(--serif);margin:26px 0 8px}
  table{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed;font-variant-numeric:tabular-nums}
  th{font:600 13px var(--sans);color:var(--mute);text-align:left;padding:5px 6px;border-bottom:1px solid var(--ink)}
  td{padding:6px;border-bottom:1px solid var(--rule);vertical-align:top}
  th.t,td.t{width:44px;font:600 16px var(--serif)}
  .c{width:22%}
  td.c b{display:block;font:600 18px/1.1 var(--serif)}
  td.c span{display:block;color:var(--ink)}
  td.c .cl{color:var(--mute);font-size:12px}
  td.c.na{color:var(--mute)}
  td.src0{background:#e3f2e7}td.src1{background:#fcf1cc}td.src2{background:#f7dedb}
  td.rainx{box-shadow:inset 0 0 0 2px #ff8a00}
  .coarse{font-style:italic;opacity:.8}
  .badge{display:inline-block;font-size:11.5px;padding:1px 6px;border-radius:4px;background:#ffe5bf;color:#7a3f00;margin:1px 3px 1px 0}
  .badge.ok{background:#dfeee3;color:#17583a}
  .badge.why{background:#f2e2df;color:#7d261e}
  .badge.why1{background:#f7ecc6;color:#664d00}
  .wdir{display:inline-block;font-size:11.5px;color:var(--mute);margin-left:2px;font-style:normal}

  /* Källor längst ned */
  .foot{margin-top:28px;padding-top:12px;border-top:1px solid var(--rule)}
  .src{display:inline-block;font-size:13px;margin:0 14px 4px 0;color:var(--mute)}
  .src b{color:var(--ink)}
  .src.error,.src.stale{color:#9a3226}

  /* Ett enda ögonblick av rörelse: rutorna fylls i när prognosen kommit */
  @keyframes pop{from{opacity:0;transform:scaleY(.2)}to{opacity:1;transform:none}}
  .sc.first .strip:not(.hrs) .h{animation:pop .32s ease-out both;animation-delay:calc(var(--i)*28ms)}
  @media (prefers-reduced-motion:reduce){.sc.first .strip .h{animation:none}}

  /* ===== Vyväxlare: Planera | Väder ===== */
  .app.wide{max-width:1060px}
  .views{display:inline-flex;gap:2px;padding:3px;margin:0 0 12px;border:1px solid var(--ink);border-radius:999px;background:var(--sheet)}
  .views button{padding:7px 22px;border-radius:999px;font-weight:600;font-size:15px;color:var(--ink);transition:background .15s,color .15s}
  .views button[aria-selected="true"]{background:var(--ink);color:var(--sheet)}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .mk{float:right;margin:0 2px 0 4px;font-size:12px;font-weight:700;color:var(--mute)}
  tr.selr td{background:#e4eee4;box-shadow:inset 0 1px 0 var(--ink),inset 0 -1px 0 var(--ink)}
  tr.selr td:first-child{box-shadow:inset 3px 0 0 var(--ink),inset 0 1px 0 var(--ink),inset 0 -1px 0 var(--ink)}

  /* ===== Väder-vyn: stora temperaturen med stämningsbakgrund ===== */
  .wx{display:grid;gap:14px}
  .sum{position:relative;overflow:hidden;border-radius:22px;padding:22px 16px 20px;text-align:center;color:var(--ink);--mute:#3b5047;background:var(--sky,#e3eff0)}
  .sum::before{content:"";position:absolute;inset:0;pointer-events:none;background:var(--deco,none)}
  .sum>*{position:relative}
  .sum[data-tone="clear"]{--sky:linear-gradient(180deg,#c9e1ee,#e3eff0 60%,#f1f5ef);--deco:radial-gradient(circle at 88% 0,rgba(255,232,150,.8),transparent 42%)}
  .sum[data-tone="cloud"]{--sky:linear-gradient(180deg,#d3dcd9,#e5ebe7 65%,#f1f5ef);--deco:radial-gradient(ellipse at 18% 14%,rgba(255,255,255,.75),transparent 50%),radial-gradient(ellipse at 82% 30%,rgba(255,255,255,.55),transparent 45%)}
  .sum[data-tone="rain"]{--sky:linear-gradient(180deg,#b9cad6,#d9e4e9 65%,#eef3f1);--deco:repeating-linear-gradient(105deg,rgba(44,110,145,.14) 0 1.5px,transparent 1.5px 14px)}
  .sum[data-tone="snow"]{--sky:linear-gradient(180deg,#d3e1eb,#e9f0f4 65%,#f5f8f7);--deco:radial-gradient(rgba(255,255,255,.95) 2px,transparent 2.6px) 0 0/22px 22px,radial-gradient(rgba(255,255,255,.8) 1.5px,transparent 2.1px) 11px 11px/22px 22px}
  .sum[data-tone="night"]{--sky:linear-gradient(180deg,#112a35,#1c4048 65%,#26504f);--deco:radial-gradient(circle at 14% 12%,rgba(255,255,255,.9) 1px,transparent 1.6px),radial-gradient(circle at 70% 22%,rgba(255,255,255,.7) 1px,transparent 1.6px),radial-gradient(circle at 44% 8%,rgba(255,255,255,.8) 1px,transparent 1.6px);color:#f1f5ef;--mute:#c9d9d1}
  .s-when{margin:0;font-size:15px;color:var(--mute)}
  .s-place{margin:2px 0 0;font:600 24px/1.2 var(--serif)}
  .s-temp{margin:2px 0 0;padding-left:.14em;font:400 clamp(84px,22vw,128px)/1 var(--serif);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .s-desc{display:flex;gap:8px;justify-content:center;align-items:center;font:600 20px/1.2 var(--serif)}
  .s-hl{margin:4px 0 0;font-size:16px}
  .s-src{margin:12px auto 0;max-width:64ch;font-size:13.5px;color:var(--mute)}

  /* Kort */
  .wc{background:var(--sheet);border:1px solid var(--rule);border-radius:18px;padding:14px 14px 12px;min-width:0}
  .wc h3{margin:0 0 8px;font:600 17px/1.2 var(--serif)}
  .wc .sub{font-size:13.5px;color:var(--mute);margin:6px 0 0}
  .wx-main{display:grid;gap:14px}
  @media (min-width:900px){.wx-main{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:start}}
  .cg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .cg .span2{grid-column:1/-1}
  .big{margin:0;font:600 30px/1.1 var(--serif);font-variant-numeric:tabular-nums}
  .big small{font:400 15px var(--sans);color:var(--mute)}
  .bar{height:8px;border-radius:4px;background:#dfe6df;overflow:hidden;margin:8px 0 4px}
  .bar i{display:block;height:100%;background:var(--sea)}

  /* Timremsa */
  .hs{position:relative;display:flex;gap:4px;overflow-x:auto;padding:2px 0 8px;scroll-snap-type:x proximity}
  .hi{flex:0 0 62px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border-radius:14px;border:2px solid transparent;font-variant-numeric:tabular-nums}
  .hi:hover{background:#eef4ee}
  .hi[aria-pressed="true"]{background:#e1ece1;border-color:var(--ink)}
  .hi .tm{font-size:14px;font-weight:600}
  .hi .tp{font:600 18px/1.1 var(--serif)}
  .hi .pr{font-size:13px;font-weight:600;color:var(--sea);min-height:17px}
  .hi .ic0{height:30px}
  .hi.ip .tp{font-style:italic}

  /* Veckolista */
  .wr{display:grid;grid-template-columns:72px 30px minmax(0,1fr);grid-template-areas:"d i r" "d i p";column-gap:8px;align-items:center;width:100%;text-align:left;padding:9px 8px;border-radius:12px;border:2px solid transparent;box-shadow:0 1px 0 var(--rule)}
  .wr:hover{background:#eef4ee}
  .wr[aria-pressed="true"]{background:#e1ece1;border-color:var(--ink);box-shadow:none}
  .wr .dn{grid-area:d;font:600 17px/1.15 var(--serif)}
  .wr .dn small{display:block;font:400 13px var(--sans);color:var(--mute)}
  .wr .wi{grid-area:i;display:flex}
  .wr .rg{grid-area:r;display:flex;align-items:center;gap:8px;font:600 16px var(--serif);font-variant-numeric:tabular-nums}
  .rg .lo{width:36px;text-align:right;color:var(--mute)}
  .rg .hg{width:36px}
  .trk{position:relative;flex:1;height:8px;border-radius:4px;background:#dfe6df}
  .trk i{position:absolute;top:0;bottom:0;border-radius:4px}
  .wr .pp{grid-area:p;font-size:13.5px;color:var(--mute);margin-top:1px}

  /* Jämför källor */
  details.cmp{background:var(--sheet);border:1px solid var(--rule);border-radius:18px;padding:12px 14px}
  details.cmp summary{cursor:pointer;font:600 18px/1.3 var(--serif)}
  details.cmp[open] summary{margin-bottom:8px}
  .badge.nb{background:#e6eee6;color:var(--ink)}
  ul.ab{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--mute)}
  ul.ab li{margin:4px 0}
  .sunrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
  .sunrow svg{width:100%;max-width:240px;justify-self:center}
  .sunrow .r{text-align:right}

  /* Tätare: lägre sammanfattning, en rad mindre på mobil */
  .sum{padding:14px 16px 14px}
  .s-place{margin:0;font-size:21px}
  .s-temp{font-size:clamp(64px,16vw,96px);margin:0}
  .s-desc{font-size:19px}
  .s-hl{margin:2px 0 0;font-size:15px}
  .s-src{margin:6px auto 0;font-size:13.5px}

  /* Väderbild: scenen ligger till höger i kortet (ändrar inte höjden), texten till vänster */
  .sum{--aw:clamp(150px,38vw,340px);text-align:left;padding-right:calc(var(--aw) + 8px);min-height:176px}
  .sum::before{display:none}
  .sum>.art{position:absolute;top:0;right:0;bottom:0;width:var(--aw);margin:0;pointer-events:none;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 26%);mask-image:linear-gradient(90deg,transparent,#000 26%)}
  .art svg{display:block;width:100%;height:100%}
  .s-desc{justify-content:flex-start}
  .s-src{margin:6px 0 0;max-width:none}
  .sum[data-tone="neutral"]{--sky:linear-gradient(180deg,#dde5e1,#eef2ee)}
  .sum[data-tone="night"]{--sky:linear-gradient(180deg,#0f2733,#1b3d4a 65%,#24494f)}
  /* Lätta animationer: bara transform/opacity på få element */
  .art .drift{animation:wxdrift var(--t,20s) ease-in-out infinite alternate}
  .art .glow{animation:wxglow 7s ease-in-out infinite alternate}
  .art .drop{animation:wxdrop 1.6s linear infinite;animation-delay:var(--d,0s)}
  .art .flake{animation:wxflake 6s linear infinite;animation-delay:var(--d,0s)}
  .art .tw{animation:wxtw 4.5s ease-in-out infinite;animation-delay:var(--d,0s)}
  @keyframes wxdrift{from{transform:translateX(calc(var(--dx,10px) * -1))}to{transform:translateX(var(--dx,10px))}}
  @keyframes wxglow{from{opacity:.75}to{opacity:1}}
  @keyframes wxdrop{0%{transform:translate(4px,-22px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(-8px,46px);opacity:0}}
  @keyframes wxflake{0%{transform:translate(0,-18px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(14px,46px);opacity:0}}
  @keyframes wxtw{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.art *{animation:none!important}}
  #viewWeather[hidden] .art *{animation-play-state:paused}
  @media (max-width:700px){
    .sum>.art{top:22px;bottom:44px}
    .s-when,.s-hl,.s-src{margin-right:calc(-1 * (var(--aw) + 6px))}
    .s-when{font-size:13.5px}
    .art svg{position:absolute;top:50%;right:-40px;width:auto;height:132px;aspect-ratio:400/240;transform:translateY(-50%)}
    .sum{--aw:132px;padding:12px 0 12px 14px;padding-right:calc(var(--aw) + 6px);min-height:0}
    .s-temp{font-size:clamp(56px,17vw,72px)}
    .s-desc{font-size:17px}
    .s-hl{font-size:14px}
    .s-src{font-size:12.5px}
  }
  @media (max-width:700px){
    .s-place{display:none}
    .chip{padding:6px 12px;font-size:14px}
    .acts{gap:6px;margin-bottom:6px}
    .hero{padding:10px 0 12px}
    .hbig{font-size:clamp(22px,6vw,28px)}
    th,td{padding:5px 4px}
    th.t,td.t{width:36px;font-size:15px}
    td.c b{font-size:16px}
  }
</style>
</head>

<script>

'use strict';
/* =====================================================================
   KONFIGURATION – ändra här
   ===================================================================== */
const CONFIG = {
  // Inga nycklar och ingen e-post används någonstans.
  CACHE_MIN: 30,            // Hur länge svar cachas (minuter)
  DAYS: 7,                  // Antal dagar som visas
  DEFAULT_LOC: { name: 'Ljungbyhed GK', lat: 56.078, lon: 13.230 }, // ungefärlig position, byt via sökrutan
};

const H = 3600e3;           // en timme i ms
const TZ = 'Europe/Stockholm';

/* =====================================================================
   FÖRINSTÄLLDA AKTIVITETSLÄGEN (null = ingen gräns)
   tol = "gul marginal" i %: lite över gränsen ger gult, mer ger rött.
   ===================================================================== */
const L = (o) => Object.assign({ tempMin: null, tempMax: null, precipMax: null, windMax: null, gustMax: null, cloudMax: null, tol: 25 }, o);
const PRESETS = {
  none:   { name: 'Ingen',               limits: L({}) },
  golf:   { name: 'Golf',                limits: L({ tempMin: 8, precipMax: 0.3, windMax: 8 }) },
  wgolf:  { name: 'Vintergolf',          limits: L({ tempMin: 3, precipMax: 0.2, windMax: 8 }) },
  walk:   { name: 'Promenad/löpning',    limits: L({ tempMin: 0, tempMax: 24, precipMax: 0.5, windMax: 10 }) },
  bike:   { name: 'Cykling',             limits: L({ tempMin: 5, tempMax: 28, precipMax: 0.2, windMax: 7, gustMax: 12 }) },
  grill:  { name: 'Grillning/utomhus',   limits: L({ tempMin: 12, precipMax: 0.1, windMax: 6 }) },
};
const FIELDS = [['tempMin','Temp min °C'],['tempMax','Temp max °C'],['precipMax','Nederbörd max mm/h'],['windMax','Vind max m/s'],['gustMax','Byvind max m/s'],['cloudMax','Moln max %']];

/* =====================================================================
   HJÄLPFUNKTIONER
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const num = (v) => (typeof v === 'number' && isFinite(v) && Math.abs(v) < 9000) ? v : null; // 9999 = saknas hos SMHI
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

// Lokal tid i Sverige (oavsett var webbläsaren är)
const partsFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' });
function localParts(ts) { const o = {}; for (const p of partsFmt.formatToParts(ts)) o[p.type] = p.value; return { date: `${o.year}-${o.month}-${o.day}`, hour: +o.hour }; }
const clockFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
const dayFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short' });
function dayLabel(dateStr) {
  const today = localParts(Date.now()).date;
  const tomorrow = localParts(Date.now() + 24 * H).date;
  const base = dayFmt.format(Date.parse(dateStr + 'T12:00:00Z'));
  return dateStr === today ? 'Idag · ' + base : dateStr === tomorrow ? 'Imorgon · ' + base : base;
}
const pad = (n) => String(n).padStart(2, '0');
const f1 = (v) => v == null ? '–' : (Math.round(v * 10) / 10).toString().replace('.', ',');

async function getJson(url, headers) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 20000);
  try {
    const r = await fetch(url, { headers, signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'Timeout' : e.message); }
  finally { clearTimeout(to); }
}

/* =====================================================================
   KÄLLOR – varje källa returnerar samma "råformat":
   { entries:[{t,temp,wind,gust,cloud}], precip:[{s,e,mm}] }
     entries = ögonblicksvärden (t i ms UTC), temp °C, vind/byvind m/s, moln %
     precip  = nederbörd mm under intervallet s..e
   ===================================================================== */
const SOURCES = {
  smhi: { name: 'SMHI', fetch: async (loc) => {
    // OBS: gamla pmp3g är nedlagt (mars 2026) – nya heter snow1g. "time" = slutet på intervallet.
    const j = await getJson(`https://opendata-download-metfcst.smhi.se/api/category/snow1g/version/1/geotype/point/lon/${loc.lon.toFixed(4)}/lat/${loc.lat.toFixed(4)}/data.json`);
    const entries = [], precip = [];
    for (const ts of j.timeSeries || []) {
      const d = ts.data, t = Date.parse(ts.time);
      const oktas = num(d.cloud_area_fraction);
      entries.push({ t, temp: num(d.air_temperature), wind: num(d.wind_speed), gust: num(d.wind_speed_of_gust), dir: num(d.wind_from_direction), cloud: oktas == null ? null : Math.min(100, oktas * 12.5) });
      const s = Date.parse(ts.intervalParametersStartTime), mm = num(d.precipitation_amount_mean);
      // Snöandel 0-1: SMHI ger frusen andel direkt, annars används nederbördstypen (5/6 snö, 7 blandat)
      const fp = num(d.precipitation_frozen_part), pt = num(d.predominant_precipitation_type_at_surface);
      const snow = (fp != null && fp >= 0) ? Math.min(1, fp > 1 ? fp / 100 : fp) : (pt == null ? null : (pt === 5 || pt === 6) ? 1 : pt === 7 ? 0.5 : 0);
      if (mm != null && s < t) precip.push({ s, e: t, mm, snow });
    }
    return { entries, precip };
  } },

  met: { name: 'Yr', fetch: async (loc) => {
    // "complete" behövs för byvind (compact saknar den). Vi sätter INGEN egen User-Agent: webbläsare kan inte det på ett
    // säkert sätt (Firefox m.fl. ger CORS-fel "NetworkError"). MET identifierar webbappar via Origin/Referer.
    const j = await getJson(`https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=${loc.lat.toFixed(3)}&lon=${loc.lon.toFixed(3)}`);
    const entries = [], precip = [];
    for (const ts of j.properties.timeseries || []) {
      const i = ts.data.instant.details, t = Date.parse(ts.time);
      entries.push({ t, temp: num(i.air_temperature), wind: num(i.wind_speed), gust: num(i.wind_speed_of_gust), dir: num(i.wind_from_direction), cloud: num(i.cloud_area_fraction) });
      const n1 = ts.data.next_1_hours, n6 = ts.data.next_6_hours;
      // Snöandel från Yrs symbolkod (t.ex. lightsnow, sleet)
      const sn = (x) => { const c = (x.summary && x.summary.symbol_code) || ''; return /snow/.test(c) ? 1 : /sleet/.test(c) ? 0.5 : 0; };
      if (n1) { const mm = num(n1.details.precipitation_amount); if (mm != null) precip.push({ s: t, e: t + H, mm, snow: sn(n1) }); }
      else if (n6) { const mm = num(n6.details.precipitation_amount); if (mm != null) precip.push({ s: t, e: t + 6 * H, mm, snow: sn(n6) }); }
    }
    return { entries, precip };
  } },

  dmi: { name: 'DMI', fetch: async (loc) => {
    // Sedan dec 2025 krävs ingen API-nyckel hos DMI (men fair use gäller). wind-speed-10m kräver crs=crs84.
    await dmiGate();
    const params = ['temperature-2m', 'wind-speed-10m', 'gust-wind-speed-10m', 'total-precipitation', 'time-integral-of-total-solid-precipitation-flux', 'fraction-of-cloud-cover'];
    return parseDmi(await getJson(`https://opendataapi.dmi.dk/v1/forecastedr/collections/harmonie_dini_sf/position?coords=POINT(${loc.lon.toFixed(4)}%20${loc.lat.toFixed(4)})&crs=crs84&parameter-name=${params.join(',')}&f=GeoJSON`));
  } },
};

// DMI:s EDR-API är begränsat till ca 1 anrop / 10 s – vänta in vid behov
async function dmiGate() {
  const last = lsGet('sv1:dmiLast', 0), wait = last + 10500 - Date.now();
  lsSet('sv1:dmiLast', Date.now() + Math.max(0, wait));
  if (wait > 0) await sleep(wait);
}

// Tolkar DMI:s svar (GeoJSON med en feature per tidssteg, eller CoverageJSON som reserv)
function parseDmi(j) {
  let rows = [];
  if (Array.isArray(j.features)) {
    rows = j.features.map((f) => ({ t: Date.parse(f.properties.step), p: f.properties }));
  } else if (j.domain && j.ranges) { // CoverageJSON
    const ts = j.domain.axes.t.values;
    rows = ts.map((t, k) => { const p = {}; for (const n in j.ranges) p[n] = j.ranges[n].values[k]; return { t: Date.parse(t), p }; });
  }
  rows = rows.filter((r) => isFinite(r.t)).sort((a, b) => a.t - b.t);
  const entries = [], precip = [];
  let prevAcc = null, prevT = null, prevSol = null;
  for (const { t, p } of rows) {
    const K = num(p['temperature-2m']), cc = num(p['fraction-of-cloud-cover']);
    entries.push({ t, temp: K == null ? null : K - 273.15, wind: num(p['wind-speed-10m'] ?? p['wind-speed']), gust: num(p['gust-wind-speed-10m']), dir: num(p['wind-dir-10m'] ?? p['wind-dir']), cloud: cc == null ? null : cc * 100 });
    // total-precipitation är ackumulerad sedan modellkörningens start (kg/m² = mm, verifierat) -> ta differens.
    // Värdet kan hoppa ned någon hundradel (brus) – det räknas som 0. Ett stort fall (>0,5) tolkas som nollställning.
    const acc = num(p['total-precipitation']);
    if (acc != null && prevAcc != null && prevT != null && t > prevT) {
      const diff = acc - prevAcc, mm = prevAcc - acc > 0.5 ? acc : Math.max(0, diff);
      // Snöandel = ökning av ackumulerad fast nederbörd delat med ökning av total (null = okänt)
      const sol = num(p['time-integral-of-total-solid-precipitation-flux']);
      const snow = (sol != null && prevSol != null && mm > 0.02) ? Math.max(0, Math.min(1, (sol - prevSol) / mm)) : null;
      precip.push({ s: prevT, e: t, mm, snow });
    }
    if (acc != null) { prevAcc = acc; prevT = t; prevSol = num(p['time-integral-of-total-solid-precipitation-flux']); }
  }
  return { entries, precip };
}

/* =====================================================================
   NORMALISERING TILL TIMRAD: Map(timme-start-ms -> {temp,wind,gust,dir,cloud,precip,snow,coarse})
   Grövre tidssteg (3/6/12 h) interpoleras linjärt (temp/vind/moln) och nederbörd fördelas jämnt.
   ===================================================================== */
function buildHourly(raw) {
  const map = new Map(), es = raw.entries, ps = raw.precip.slice().sort((a, b) => a.s - b.s);
  if (!es.length) return map;
  const first = Math.ceil(es[0].t / H) * H, last = es[es.length - 1].t;
  let i = 0, pi = 0;
  for (let h = first; h <= last; h += H) {
    while (i + 1 < es.length && es[i + 1].t <= h) i++;
    const a = es[i], b = es[i + 1], exact = a.t === h;
    const f = (!exact && b) ? (h - a.t) / (b.t - a.t) : 0;
    const lerp = (x, y) => x == null ? null : (y == null || f === 0 ? x : x + (y - x) * f);
    const lerpDeg = (x, y) => {
      if (x == null) return null;
      if (y == null || f === 0) return ((x % 360) + 360) % 360;
      const d = ((y - x + 540) % 360) - 180;
      return ((x + d * f) % 360 + 360) % 360;
    };
    while (pi < ps.length && ps[pi].e <= h) pi++;
    const p = ps[pi]; let precip = null, pc = false, snow = null;
    if (p && p.s <= h) { precip = Math.round(p.mm * H / (p.e - p.s) * 100) / 100; pc = (p.e - p.s) > H; snow = p.snow ?? null; }
    map.set(h, { t: h, temp: lerp(a.temp, b && b.temp), wind: lerp(a.wind, b && b.wind), gust: a.gust, dir: lerpDeg(a.dir, b && b.dir), cloud: lerp(a.cloud, b && b.cloud), precip, snow, coarse: !exact || pc });
  }
  return map;
}

// Vindriktning i grader (varifrån vinden blåser) -> kompassriktning och pil
const COMPASS = ['N', 'NO', 'O', 'SO', 'S', 'SV', 'V', 'NV'];
const COMPASS_LONG = ['nordlig', 'nordostlig', 'ostlig', 'sydostlig', 'sydlig', 'sydvästlig', 'västlig', 'nordvästlig'];
const dirCard = (d) => d == null ? '' : COMPASS[Math.round(((d % 360) + 360) % 360 / 45) % 8];
const dirLong = (d) => d == null ? '' : COMPASS_LONG[Math.round(((d % 360) + 360) % 360 / 45) % 8];
const meanDeg = (degs) => {
  const v = degs.filter((x) => x != null); if (!v.length) return null;
  const R = Math.PI / 180;
  const sx = v.reduce((a, d) => a + Math.cos(d * R), 0) / v.length;
  const sy = v.reduce((a, d) => a + Math.sin(d * R), 0) / v.length;
  return (Math.atan2(sy, sx) / R + 360) % 360;
};

/* =====================================================================
   CACHE (localStorage) + hämtning med felhantering
   ===================================================================== */
async function loadSource(id, loc, force) {
  const key = `sv2:cache:${id}:${loc.lat.toFixed(3)},${loc.lon.toFixed(3)}`;
  const c = lsGet(key, null), maxAge = CONFIG.CACHE_MIN * 60e3;
  if (c && !force && Date.now() - c.ts < maxAge) return { status: 'ok', ts: c.ts, cached: true, raw: c.raw };
  try {
    const raw = await SOURCES[id].fetch(loc);
    if (!raw.entries.length) throw new Error('Tomt svar');
    pruneCache(); lsSet(key, { ts: Date.now(), raw });
    return { status: 'ok', ts: Date.now(), raw };
  } catch (e) {
    if (c) return { status: 'stale', ts: c.ts, msg: e.message, raw: c.raw };   // visa gammal data hellre än ingen
    return { status: 'error', msg: e.message };
  }
}
function pruneCache() { // håll max ~12 cache-poster så localStorage inte fylls
  const keys = Object.keys(localStorage).filter((k) => k.startsWith('sv2:cache:'));
  if (keys.length < 12) return;
  keys.map((k) => [k, (lsGet(k, {}) || {}).ts || 0]).sort((a, b) => a[1] - b[1]).slice(0, keys.length - 8).forEach(([k]) => localStorage.removeItem(k));
}

/* =====================================================================
   POÄNG: 0 = grön, 1 = gul, 2 = röd, null = ingen bedömning
   ===================================================================== */
function judge(lim, h) {
  let worst = 0, any = false;
  const chk = (v, limit, over, floor) => {
    if (limit == null || v == null) return; any = true;
    const margin = Math.max(Math.abs(limit) * (lim.tol ?? 25) / 100, floor);
    const viol = over ? v - limit : limit - v;
    if (viol > 0) worst = Math.max(worst, viol <= margin ? 1 : 2);
  };
  chk(h.temp, lim.tempMin, false, 2); chk(h.temp, lim.tempMax, true, 2);
  chk(h.precip, lim.precipMax, true, 0.2);
  chk(h.wind, lim.windMax, true, 1.5); chk(h.gust, lim.gustMax, true, 2);
  chk(h.cloud, lim.cloudMax, true, 10);
  return any ? worst : null;
}
// Samlad poäng över källor: snitt av källornas poäng (0 grön ... 2 röd)
function consensus(statuses) {
  const s = statuses.filter((x) => x != null); if (!s.length) return null;
  const m = s.reduce((a, b) => a + b, 0) / s.length;
  return m < 0.5 ? 0 : m < 1.25 ? 1 : 2;
}
// Snö: en källa räknas som "snö" när den har nederbörd (>= 0,1 mm) och snöandel >= 50 %.
// En timme får ❄ när minst hälften av källorna med nederbörd säger snö.
const snowy = (h) => h && h.precip != null && h.precip >= 0.1 && h.snow != null && h.snow >= 0.5;
const hourSnow = (r) => { const wet = Object.values(r.s).filter((h) => h && h.precip != null && h.precip >= 0.1); return wet.length > 0 && wet.filter(snowy).length * 2 >= wet.length; };

// Var är källorna överens/oense? Returnerar lista med etiketter.
function agreement(hs) {
  const have = hs.filter(Boolean); if (have.length < 2) return [];
  const out = [];
  const wet = have.filter((h) => h.precip != null);
  if (wet.length >= 2) {
    const pos = wet.filter((h) => h.precip >= 0.1);
    if (pos.length > 0 && pos.length < wet.length) {
      const snN = pos.filter(snowy).length, slN = pos.filter((h) => h.snow != null && h.snow >= 0.2).length;
      const kind = snN * 2 >= pos.length ? 'snö' : slN * 2 >= pos.length ? 'snöbl.' : 'regn';
      out.push(`${kind} ${pos.length}/${wet.length}`);
    }
  }
  const spread = (k) => { const v = have.map((h) => h[k]).filter((x) => x != null); return v.length > 1 ? Math.max(...v) - Math.min(...v) : 0; };
  if (spread('temp') >= 3) out.push('temp ±' + f1(spread('temp') / 2));
  if (spread('wind') >= 3) out.push('vind ±' + f1(spread('wind') / 2));
  if (spread('cloud') >= 50) out.push('moln ±' + Math.round(spread('cloud') / 2) + ' %');
  return out;
}
const hasPrecipDis = (ag) => ag.some((a) => /^(regn|snö)/.test(a));

// Vilka gränsvärden spricker en timme på? (för förklaring i tabell, tooltip och hero)
function hourReasons(lim, r) {
  const hs = Object.values(r.s).filter(Boolean); if (!hs.length) return [];
  const out = [];
  if (lim.tempMin != null && hs.some((h) => h.temp != null && h.temp < lim.tempMin)) out.push('kallt');
  if (lim.tempMax != null && hs.some((h) => h.temp != null && h.temp > lim.tempMax)) out.push('varmt');
  if (lim.precipMax != null && hs.some((h) => h.precip != null && h.precip > lim.precipMax)) out.push(hourSnow(r) ? 'snö' : 'nederbörd');
  if (lim.windMax != null && hs.some((h) => h.wind != null && h.wind > lim.windMax)) out.push('vind');
  if (lim.gustMax != null && hs.some((h) => h.gust != null && h.gust > lim.gustMax)) out.push('byvind');
  if (lim.cloudMax != null && hs.some((h) => h.cloud != null && h.cloud > lim.cloudMax)) out.push('moln');
  return out;
}

// Bästa sammanhängande fönster: längsta gröna, annars längsta gröna/gula, minst minLen timmar
function bestWindow(rows, minLen) { // rows: [{t,c}] sorterade
  for (const level of [0, 1]) {
    let best = null, run = [];
    const close = () => { if (run.length >= minLen && (!best || run.length > best.length)) best = run; run = []; };
    for (const r of rows) {
      if (r.c != null && r.c <= level && (!run.length || r.t - run[run.length - 1].t === H)) run.push(r);
      else { close(); if (r.c != null && r.c <= level) run = [r]; }
    }
    close();
    if (best) return { from: best[0].t, to: best[best.length - 1].t + H, len: best.length, level };
  }
  return null;
}

/* =====================================================================
   TILLSTÅND + SPARADE INSTÄLLNINGAR
   ===================================================================== */
const saved = lsGet('sv1:settings', {});
const state = {
  loc: saved.loc || CONFIG.DEFAULT_LOC,
  favs: saved.favs || [CONFIG.DEFAULT_LOC],
  act: saved.act || 'golf',
  modes: Object.assign(JSON.parse(JSON.stringify(PRESETS)), saved.modes || {}),
  from: saved.from ?? 7, to: saved.to ?? 19, minLen: saved.minLen ?? 3,
  view: saved.view === 'weather' ? 'weather' : 'plan',   // vald vy (sparas)
  selDay: null, selHour: null, editOpen: false, placeOpen: false, animDone: false, cmpOpen: false, aboutOpen: false, center: true, fk: null,
  src: {},   // id -> {status, ts, msg, hours}
};
function save() { lsSet('sv1:settings', { loc: state.loc, favs: state.favs, act: state.act, modes: state.modes, from: state.from, to: state.to, minLen: state.minLen, view: state.view }); }

async function load(force) {
  for (const id in SOURCES) state.src[id] = { status: 'loading' };
  render();
  await Promise.all(Object.keys(SOURCES).map(async (id) => {
    const r = await loadSource(id, state.loc, force);
    if (r.raw) r.hours = buildHourly(r.raw);
    state.src[id] = r; render();
  }));
}

/* =====================================================================
   RENDERING
   ===================================================================== */
// Bygger dagslista: [{date, hours:[{t, s:{smhi,met,dmi}}]}] inom tidsfiltret
function buildDays(from = state.from, to = state.to) {   // Planera: tidsfiltret, Väder: 0-24
  const nowH = Math.floor(Date.now() / H) * H, byDay = new Map(), all = new Set();
  for (const id in SOURCES) { const s = state.src[id]; if (s && s.hours) for (const t of s.hours.keys()) if (t >= nowH) all.add(t); }
  for (const t of [...all].sort((a, b) => a - b)) {
    const p = localParts(t); if (p.hour < from || p.hour >= to) continue;
    if (!byDay.has(p.date)) byDay.set(p.date, []);
    const s = {}; for (const id in SOURCES) s[id] = state.src[id] && state.src[id].hours ? state.src[id].hours.get(t) : undefined;
    byDay.get(p.date).push({ t, s });
  }
  return [...byDay.entries()].slice(0, CONFIG.DAYS).map(([date, hours]) => ({ date, hours }));
}
function scoreRows(day, lim) { // lägger på källpoäng + samlad poäng + enighet
  const hasLim = Object.entries(lim).some(([k, v]) => k !== 'tol' && v != null);
  for (const r of day.hours) {
    r.st = {}; for (const id in SOURCES) r.st[id] = (hasLim && r.s[id]) ? judge(lim, r.s[id]) : null;
    r.c = hasLim ? consensus(Object.values(r.st)) : null;
    r.agree = agreement(Object.values(r.s));
  }
  return hasLim;
}
function summary(day, id) {
  const hs = day.hours.map((r) => r.s[id]).filter(Boolean); if (!hs.length) return null;
  const t = hs.map((h) => h.temp).filter((x) => x != null), w = hs.map((h) => h.wind).filter((x) => x != null), p = hs.map((h) => h.precip).filter((x) => x != null);
  return { tmin: Math.min(...t), tmax: Math.max(...t), wmax: w.length ? Math.max(...w) : null, rain: p.length ? p.reduce((a, b) => a + b, 0) : null, n: hs.length, of: day.hours.length };
}
const hhmm = (t) => pad(localParts(t).hour);
const longFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });
const shortWd = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, weekday: 'short' });
const monFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, month: 'short' });
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const noon = (date) => Date.parse(date + 'T12:00:00Z');
function relDay(date) { // "Idag", "Imorgon" eller ingenting
  const today = localParts(Date.now()).date, tomorrow = localParts(Date.now() + 24 * H).date;
  return date === today ? 'Idag' : date === tomorrow ? 'Imorgon' : '';
}
function longDay(date) { const r = relDay(date), l = cap(longFmt.format(noon(date)).replace('.', '')); return r ? `${r}, ${l.toLowerCase()}` : l; }
// Villkoren i klartext, t.ex. "minst 8 °C, högst 0,3 mm regn per timme, högst 8 m/s vind"
function limitsText(l) {
  const p = [];
  if (l.tempMin != null) p.push(`minst ${f1(l.tempMin)} °C`);
  if (l.tempMax != null) p.push(`högst ${f1(l.tempMax)} °C`);
  if (l.precipMax != null) p.push(`högst ${f1(l.precipMax)} mm nederbörd per timme`);
  if (l.windMax != null) p.push(`högst ${f1(l.windMax)} m/s vind`);
  if (l.gustMax != null) p.push(`byvind högst ${f1(l.gustMax)} m/s`);
  if (l.cloudMax != null) p.push(`moln högst ${f1(l.cloudMax)} %`);
  return p.join(', ');
}
const FLAG = '<svg class="flag" viewBox="0 0 24 34" width="30" height="42" aria-hidden="true"><path d="M5 2v30" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M6.2 3.2 21 9.5 6.2 16z" fill="currentColor"/><ellipse cx="5" cy="32" rx="5" ry="1.6" fill="currentColor" opacity=".25"/></svg>';

function dayAvg(day) { // genomsnitt över källorna för dagens sammanfattning
  const ss = Object.keys(SOURCES).map((id) => summary(day, id)).filter(Boolean); if (!ss.length) return null;
  const m = (k) => { const v = ss.map((s) => s[k]).filter((x) => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  return { tmin: m('tmin'), tmax: m('tmax'), rain: m('rain'), wmax: m('wmax') };
}

// Källstatus (används både längst ned i Planera och i Väder)
function sourcesHtml() {
  return Object.keys(SOURCES).map((id) => {
    const s = state.src[id] || { status: 'loading' }, n = SOURCES[id].name;
    const tm = s.ts ? clockFmt.format(s.ts) : '';
    const txt = { loading: 'laddar…', ok: `✓ ${tm}${s.cached ? ' (cache)' : ''}`, stale: `⚠ gammal data från ${tm} (${esc(s.msg)})`, error: `✗ ${esc(s.msg)}` }[s.status];
    return `<span class="src ${s.status}"><b>${n}</b> ${txt}</span>`;
  }).join('');
}
function restoreFocus() { // efter omritning: lägg tillbaka fokus på det man just klickade på
  if (!state.fk) return;
  const el = document.querySelector(`[data-fk="${state.fk}"]`); state.fk = null;
  if (el) el.focus({ preventScroll: true });
}

// Gemensam rendering (plats, vyflikar, källstatus) + vald vy. Båda vyerna läser samma state.src/buildDays – inga egna anrop.
function render() {
  const isPlan = state.view !== 'weather';
  $('app').classList.toggle('wide', !isPlan);
  for (const [v, pane] of [['plan', 'viewPlan'], ['weather', 'viewWeather']]) {
    const on = state.view === v || (v === 'plan' && isPlan);
    $('tab-' + v).setAttribute('aria-selected', on); $('tab-' + v).tabIndex = on ? 0 : -1;
    $(pane).hidden = !on;
  }
  $('locName').textContent = state.loc.name;
  $('placePanel').hidden = !state.placeOpen;
  if ($('placeBtn')) $('placeBtn').setAttribute('aria-expanded', state.placeOpen);
  const isFav = state.favs.some((f) => f.lat === state.loc.lat && f.lon === state.loc.lon);
  $('favBtn').textContent = isFav ? '★ Sparad plats' : '☆ Spara plats';
  $('favs').innerHTML = state.favs.map((f, i) => `<button class="chip" data-a="goFav" data-i="${i}">${esc(f.name)}</button>`).join('');
  $('sources').innerHTML = sourcesHtml();
  $('sources').hidden = !isPlan;          // i Väder visas källstatus i kortet i stället
  if (isPlan) renderPlan(); else renderWeather();
  restoreFocus();
}

// Förklarar varför inget fönster hittades och föreslår snabba alternativ
function diagnoseNoWindow(days, lim) {
  const counts = { kallt: 0, varmt: 0, nederbörd: 0, snö: 0, vind: 0, byvind: 0, moln: 0 };
  let total = 0;
  for (const d of days) for (const r of d.hours) {
    if (r.c != null && r.c > 0) {
      total++;
      for (const k of hourReasons(lim, r)) counts[k] = (counts[k] || 0) + 1;
    }
  }
  const top = Object.entries(counts).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);
  const phrases = {
    kallt: lim.tempMin != null ? `för kallt (under ${f1(lim.tempMin)} °C)` : 'för kallt',
    varmt: lim.tempMax != null ? `för varmt (över ${f1(lim.tempMax)} °C)` : 'för varmt',
    nederbörd: 'för mycket regn/nederbörd',
    snö: 'snöfall',
    vind: lim.windMax != null ? `för blåsigt (över ${f1(lim.windMax)} m/s)` : 'för blåsigt',
    byvind: 'kraftiga byvindar',
    moln: 'för molnigt',
  };
  const reasonTxt = top.length
    ? 'Främst ' + top.slice(0, 2).map(([k]) => phrases[k]).join(' och ') + ' under tidsfönstret.'
    : 'Prova mildare gränsvärden eller ett längre tidsfönster.';

  // Kolla om ett annat läge (t.ex. Vintergolf) eller kortare fönster hade gett träff
  const chips = [];
  if (state.act === 'golf' && state.modes.wgolf) {
    chips.push(`<button class="chip" data-a="act" data-id="wgolf">Prova Vintergolf →</button>`);
  }
  if (state.minLen > 1) {
    for (let ml = state.minLen - 1; ml >= 1; ml--) {
      const hasShort = days.some((d) => bestWindow(d.hours, ml));
      if (hasShort) {
        chips.push(`<button class="chip" data-a="setMinLen" data-len="${ml}">Visa ${ml} h-fönster →</button>`);
        break;
      }
    }
  }
  if (!state.editOpen) {
    chips.push(`<button class="chip" data-a="toggleEdit">Justera gränsvärden ▾</button>`);
  }
  return { reasonTxt, chipsHtml: chips.length ? `<div class="hero-acts">${chips.join('')}</div>` : '' };
}

// Inline-SVG jämförelsegraf för vald dag (temperaturkurvor per källa + spridningsband + nederbörd)
function dayChartHtml(day, lim, hasLim, wPx) {  // wPx = tillgänglig bredd i px (så att texten blir läsbar), annars 680
  if (!day || day.hours.length < 2) return '';
  const hrs = day.hours;
  const temps = [];
  for (const r of hrs) for (const id in SOURCES) { const h = r.s[id]; if (h && h.temp != null) temps.push(h.temp); }
  if (temps.length < 2) return '';
  let tmin = Math.min(...temps), tmax = Math.max(...temps);
  // Gränslinjen ritas bara när den ligger nära kurvorna, annars plattas kurvorna ut av en lång skala
  const limNear = hasLim && lim.tempMin != null && lim.tempMin >= tmin - 2 && lim.tempMin <= tmax + 2;
  if (limNear) { tmin = Math.min(tmin, lim.tempMin); tmax = Math.max(tmax, lim.tempMin); }
  const padT = Math.max(1, (tmax - tmin) * 0.15);
  // Jämna axelsteg (1, 2, 5 eller 10 grader), högst ca 4 intervall
  const step = [1, 2, 5, 10].find((st) => (tmax - tmin + 2 * padT) / st <= 4) || 10;
  const lo = Math.floor((tmin - padT) / step) * step, hi = Math.ceil((tmax + padT) / step) * step, span = Math.max(1, hi - lo);
  const W = Math.max(300, Math.round(wPx || 680)), Hc = 156, L = 38, R = 14, T = 14, B = 26, cw = W - L - R, ch = Hc - T - B;
  const xOf = (i) => L + (hrs.length === 1 ? cw / 2 : (i / (hrs.length - 1)) * cw);
  const yOf = (v) => T + (1 - (v - lo) / span) * ch;

  // Spridningsband (min..max mellan källorna)
  const topPts = [], botPts = [];
  hrs.forEach((r, i) => {
    const vs = Object.keys(SOURCES).map((id) => r.s[id] && r.s[id].temp).filter((x) => x != null);
    if (vs.length) {
      topPts.push(`${xOf(i).toFixed(1)},${yOf(Math.max(...vs)).toFixed(1)}`);
      botPts.unshift(`${xOf(i).toFixed(1)},${yOf(Math.min(...vs)).toFixed(1)}`);
    }
  });
  const band = topPts.length > 1 ? `<polygon points="${topPts.concat(botPts).join(' ')}" fill="#14332a" opacity=".13"/>` : '';

  // Horisontella hjälplinjer + eventuell gränslinje
  const ticks = []; for (let v = lo; v <= hi; v += step) ticks.push(v);
  const grid = ticks.map((v) => {
    const y = yOf(v).toFixed(1);
    return `<line x1="${L}" y1="${y}" x2="${W - R}" y2="${y}" stroke="#cfd9cf" stroke-width="1" stroke-dasharray="2 3"/><text x="${L - 6}" y="${+y + 4}" text-anchor="end" font-size="11.5" fill="#5a6e65">${String(v).replace('-', '−')}°</text>`;
  }).join('');
  const limLine = limNear
    ? `<line x1="${L}" y1="${yOf(lim.tempMin).toFixed(1)}" x2="${W - R}" y2="${yOf(lim.tempMin).toFixed(1)}" stroke="#3e9b58" stroke-width="1.4" stroke-dasharray="5 3"/><text x="${W - R - 2}" y="${(yOf(lim.tempMin) - 4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#17583a" font-weight="600">min ${f1(lim.tempMin)}°</text>`
    : '';

  // Nederbördsstaplar i botten
  const bw = Math.max(6, Math.min(22, cw / hrs.length * 0.55));
  const bars = hrs.map((r, i) => {
    const ps = Object.values(r.s).filter((x) => x && x.precip != null).map((x) => x.precip);
    const pm = ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : 0;
    if (pm < 0.1) return '';
    const bh = Math.min(ch * 0.42, Math.max(4, (pm / 3) * (ch * 0.42)));
    const x = xOf(i) - bw / 2, y = T + ch - bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${hourSnow(r) ? '#6ea6c6' : '#2c6e91'}" opacity=".32"/>`;
  }).join('');

  // Kurva per källa
  const styles = {
    smhi: 'stroke="#14332a" stroke-width="2.2"',
    met:  'stroke="#2c6e91" stroke-width="2.2" stroke-dasharray="6 3"',
    dmi:  'stroke="#8c564b" stroke-width="2.2" stroke-dasharray="2 3.5" stroke-linecap="round"',
  };
  const lines = Object.keys(SOURCES).map((id) => {
    const pts = [];
    hrs.forEach((r, i) => { const h = r.s[id]; if (h && h.temp != null) pts.push(`${xOf(i).toFixed(1)},${yOf(h.temp).toFixed(1)}`); });
    const col = (styles[id].match(/stroke="([^"]+)"/) || [])[1] || '#14332a';
    const dots = hrs.length <= 14 ? pts.map((q) => `<circle cx="${q.split(',')[0]}" cy="${q.split(',')[1]}" r="2.4" fill="${col}"/>`).join('') : '';
    return pts.length > 1 ? `<polyline fill="none" ${styles[id] || ''} points="${pts.join(' ')}"/>${dots}` : '';
  }).join('');

  // Tidsaxel
  const xStep = hrs.length > 16 ? 3 : hrs.length > 10 ? 2 : 1;
  const xAxis = hrs.map((r, i) => (i % xStep === 0) ? `<text x="${xOf(i).toFixed(1)}" y="${Hc - 6}" text-anchor="middle" font-size="11" fill="#5a6e65">${hhmm(r.t)}</text>` : '').join('');

  return `<div class="dchart" aria-label="Temperatur- och nederbördsjämförelse över dagen">
    <div class="dchart-top">
      <span><b>Källornas temperaturspann (°C)</b> &amp; nederbörd</span>
      <span class="dchart-leg"><span><i></i>SMHI</span><span><i class="yr"></i>Yr</span><span><i class="dmi"></i>DMI</span></span>
    </div>
    <svg viewBox="0 0 ${W} ${Hc}" role="img" aria-label="Graf över temperatur per källa">${grid}${band}${bars}${limLine}${lines}${xAxis}</svg>
  </div>`;
}

/* =====================================================================
   PLANERA – scorekortet (logik oförändrad)
   ===================================================================== */
function renderPlan() {
  const mode = state.modes[state.act] || state.modes.none, lim = mode.limits;

  // Aktivitetsknappar + editor
  $('acts').innerHTML = Object.entries(state.modes).map(([id, m]) => `<button class="chip ${id === state.act ? 'on' : ''}" data-a="act" data-id="${id}" aria-pressed="${id === state.act}">${esc(m.name)}</button>`).join('') + `<button class="chip plus" data-a="newMode">+ Eget läge</button>`;
  $('editBtn').setAttribute('aria-expanded', state.editOpen);
  $('filtPanel').hidden = !state.editOpen;
  $('filtSum').textContent = `${pad(state.from)}–${pad(state.to)} · minst ${state.minLen} h`;
  const editingInput = document.activeElement && document.activeElement.tagName === 'INPUT' && $('edit').contains(document.activeElement);
  if (state.editOpen && !editingInput) renderEditor(mode);

  const days = buildDays();
  if (!days.length) {
    const loading = Object.values(state.src).some((s) => s.status === 'loading');
    $('hero').innerHTML = `<p class="hbig">${loading ? 'Hämtar prognoser…' : 'Ingen prognos tillgänglig'}</p><p class="hsub">${loading ? '' : 'Kontrollera källorna längst ned och tryck på ↻.'}</p>`;
    $('days').innerHTML = ''; if ($('dayChart')) $('dayChart').innerHTML = ''; $('detail').innerHTML = ''; $('detailTitle').textContent = ''; return;
  }
  const selDay = days.some((d) => d.date === state.selDay) ? state.selDay : days[0].date;   // ändrar inte delat val om dagen saknas här
  let hasLim = false;
  for (const d of days) hasLim = scoreRows(d, lim);
  const allLoaded = Object.values(state.src).every((s) => s.status !== 'loading');

  // ----- Hero: svaret i klartext -----
  const cands = hasLim ? days.map((d) => ({ d, w: bestWindow(d.hours, state.minLen) })).filter((x) => x.w) : [];
  cands.sort((a, b) => a.w.level - b.w.level || b.w.len - a.w.len);
  if (!hasLim) {
    $('hero').innerHTML = `<span class="flagbox" style="color:var(--mute)">${FLAG}</span><div><p class="hbig">Rå prognos</p><p class="hsub">Välj en aktivitet så markeras de timmar som passar.</p></div>`;
  } else if (cands.length) {
    const { d, w } = cands[0], endH = localParts(w.to - 1).hour + 1;
    $('hero').innerHTML = `<span class="flagbox s${w.level}">${FLAG}</span><div>
      <p class="hq">Bästa tiden för ${esc(mode.name.toLowerCase())} de närmaste dagarna</p>
      <p class="hbig">${esc(longDay(d.date))}, kl ${hhmm(w.from)}–${pad(endH)}</p>
      <p class="hsub">${w.len} h i rad ${w.level === 0 ? 'som passar' : 'i gränsfall (gult), fortfarande användbart'}.</p></div>`;
  } else {
    const diag = diagnoseNoWindow(days, lim);
    $('hero').innerHTML = `<span class="flagbox s2">${FLAG}</span><div><p class="hbig">Inget bra fönster de närmaste dagarna</p><p class="hsub">${esc(diag.reasonTxt)}</p>${diag.chipsHtml}</div>`;
  }

  // ----- Scorekortet: en rad per dag, en ruta per timme -----
  const hours = []; for (let h = state.from; h < state.to; h++) hours.push(h);
  const step = hours.length > 18 ? 3 : hours.length > 12 ? 2 : 1;
  const headCells = hours.map((h) => `<i>${(h - state.from) % step === 0 ? pad(h) : ''}</i>`).join('');
  const rainCls = (mm) => mm == null ? 'r0' : mm < 0.1 ? 'r0' : mm < 0.5 ? 'r1' : mm < 1.5 ? 'r2' : 'r3';
  const rows = days.map((d) => {
    const bw = hasLim ? bestWindow(d.hours, state.minLen) : null;
    const byHour = new Map(d.hours.map((r) => [localParts(r.t).hour, r]));
    const cells = hours.map((h, i) => {
      const r = byHour.get(h);
      if (!r) return `<i class="h na" style="--i:${i}"></i>`;
      const dis = hasPrecipDis(r.agree) ? ' dis' : '';
      const inBest = bw && r.t >= bw.from && r.t < bw.to ? ' best' : '';
      const sn = hourSnow(r) ? ' snow' : '';
      const hsel = d.date === selDay && state.selHour === r.t ? ' hsel' : '';
      let cls;
      if (hasLim) cls = r.c == null ? 'na' : 's' + r.c;
      else { const ps = Object.values(r.s).filter((x) => x && x.precip != null).map((x) => x.precip); cls = rainCls(ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : null); }
      const cc = combine(r);
      const why = hasLim && r.c > 0 ? hourReasons(lim, r) : [];
      const tip = cc ? `Kl ${pad(h)}: ${f1(cc.temp)} °C, ${f1(cc.precip)} mm, ${f1(cc.wind)} m/s${why.length ? ' (' + why.join(', ') + ')' : ''}` : `Kl ${pad(h)}`;
      return `<i class="h ${cls}${dis}${inBest}${sn}${hsel}" style="--i:${i}" data-t="${r.t}" title="${esc(tip)}"></i>`;
    }).join('');
    const a = dayAvg(d);
    const nSnow = d.hours.filter(hourSnow).length;
    const rainStr = a && a.rain != null ? (nSnow && a.rain > 0 && a.rain < 0.05 ? '<0,1' : f1(a.rain)) : '–';
    const sum = a ? `${f1(a.tmin)} till ${f1(a.tmax)} °C, ${nSnow ? 'nederbörd' : 'regn'} ${rainStr} mm${nSnow ? ` (❄ snö ${nSnow} h)` : ''}, vind ${f1(a.wmax)} m/s` : 'ingen data';
    const wd = relDay(d.date) || cap(shortWd.format(noon(d.date)).replace('.', ''));
    const dayNo = new Date(noon(d.date)).getUTCDate();
    return `<button class="drow ${d.date === selDay ? 'sel' : ''}" data-a="day" data-d="${d.date}" data-fk="pd${d.date}" aria-pressed="${d.date === selDay}" aria-label="${esc(longDay(d.date))}">
      <span class="dname">${esc(wd)}<small>${dayNo} ${esc(monFmt.format(noon(d.date)).replace('.', ''))}</small></span>
      <span class="strip">${cells}</span><span class="dsum">${esc(sum)}</span></button>`;
  }).join('');
  const legend = hasLim
    ? `<span><i class="h s0"></i>passar</span><span><i class="h s1"></i>gränsfall (användbart)</span><span><i class="h s2"></i>passar inte</span><span><i class="h na dis"></i>källorna oense om nederbörd</span><span><i class="h s0 best"></i>dagens bästa fönster</span><span><i class="h s0 snow"></i>snö</span>`
    : `<span><i class="h r0"></i>torrt</span><span><i class="h r1"></i>lite regn</span><span><i class="h r2"></i>regn</span><span><i class="h r3"></i>mycket regn</span><span><i class="h r1 snow"></i>snö</span><span><i class="h na dis"></i>källorna oense om nederbörd</span>`;
  $('days').innerHTML = `<div class="sc ${allLoaded && !state.animDone ? 'first' : ''}"><div class="drow head"><span></span><span class="strip hrs">${headCells}</span></div>${rows}</div><div class="legend">${legend}</div>`;
  if (allLoaded && !state.animDone) setTimeout(() => { state.animDone = true; }, 1500);

  // ----- Graf + timdetalj för vald dag -----
  const d = days.find((x) => x.date === selDay);
  $('detailTitle').textContent = `${longDay(d.date)}, timme för timme`;
  if ($('dayChart')) $('dayChart').innerHTML = dayChartHtml(d, lim, hasLim, $('dayChart').clientWidth - 24);
  $('detail').innerHTML = detailTable(d, hasLim, state.selHour, null, lim);
}

// Timtabell med alla källor (delas av Planera och Väder). scored = färga efter aktivitetens poäng (bara Planera).
function detailTable(d, scored, selT, note, lim) {
  const head = `<tr><th class="t">Tid</th><th>${scored ? 'Samlat' : 'Enighet'}</th>${Object.keys(SOURCES).map((id) => `<th class="c">${SOURCES[id].name}</th>`).join('')}</tr>`;
  const LBL = ['passar', 'gränsfall (användbart)', 'passar inte'];
  const body = d.hours.map((r) => {
    const wetN = Object.values(r.s).filter((h) => h && h.precip != null && h.precip >= 0.1).length, haveN = Object.values(r.s).filter((h) => h && h.precip != null).length;
    const rainX = haveN >= 2 && wetN > 0 && wetN < haveN;
    const cells = Object.keys(SOURCES).map((id) => {
      const h = r.s[id];
      if (!h) return `<td class="c na">–</td>`;     // saknad källa visas som –, aldrig som 0
      const st = scored && r.st ? r.st[id] : null;
      const mk = st == null ? '' : `<span class="mk" aria-hidden="true">${['✓', '~', '✕'][st]}</span><span class="vh">${LBL[st]}. </span>`;
      const dc = dirCard(h.dir);
      return `<td class="c ${st == null ? '' : 'src' + st} ${rainX && h.precip != null ? 'rainx' : ''} ${h.coarse ? 'coarse' : ''}">
        ${mk}<b>${f1(h.temp)}°</b><span>${snowy(h) ? '❄ ' : ''}${h.precip == null ? '–' : f1(h.precip)} mm${h.precip >= 0.1 && h.snow != null ? (h.snow >= 0.8 ? ' snö' : h.snow >= 0.2 ? ' snöblandat' : '') : ''}</span><span>${f1(h.wind)}${h.gust != null ? ' (' + f1(h.gust) + ')' : ''} m/s${dc ? `<i class="wdir" title="Vindriktning ${esc(dirLong(h.dir))}">${dc}</i>` : ''}</span><span class="cl">moln ${h.cloud == null ? '–' : Math.round(h.cloud)} %</span></td>`;
    }).join('');
    const why = (scored && lim && r.c > 0) ? hourReasons(lim, r).map((w) => `<span class="badge ${r.c === 1 ? 'why1' : 'why'}">${esc(w)}</span>`).join('') : '';
    const badges = r.agree.length ? r.agree.map((a) => `<span class="badge">${esc(a)}</span>`).join('') : (!why && Object.values(r.s).filter(Boolean).length > 1 ? '<span class="badge ok">överens</span>' : '');
    return `<tr class="${r.t === selT ? 'selr' : ''}" data-row-t="${r.t}"><td class="t">${hhmm(r.t)}</td><td>${scored && r.c != null ? `<i class="h s${r.c} mini"></i><span class="vh">${LBL[r.c]}. </span>` : ''}${why}${badges}</td>${cells}</tr>`;
  }).join('');
  return `<table>${head}${body}</table><p class="note">${note ? esc(note) : 'Varje källa visar temperatur, nederbörd, vind (byvind, riktning) och moln. ❄ betyder att källan själv anger snö. Orange ram betyder att källorna är oense om nederbörd. Kursiv text är interpolerad från grövre tidssteg.'}</p>`;
}

function renderEditor(mode) {

      <label>Gul marginal %<input type="number" step="1" min="0" data-l="tol" value="${mode.limits.tol ?? 25}"></label></div>

/* =====================================================================
   VÄDER-VYN – allmän prognos. Färgas aldrig efter aktivitetens gränsvärden.
   Samma data och samma state som Planera (inga egna anrop).

   Så räknas värdena (samma regler överallt i vyn):
   - Samlad timme = medelvärde över de källor som har ett värde just den timmen. En saknad källa räknas
     aldrig som 0, den lämnas utanför snittet. Gäller temp, nederbörd, vind, byvind och moln.
   - Dagens högsta/lägsta, nederbördssumma och högsta vind = dayAvg(): medelvärde av källornas EGNA dagsvärden
     (samma hjälpare som Planera, men här över hela dygnet i stället för tidsfiltret).
   - Väderbeskrivning (härledd, ingen källa anger den): nederbörd ≥ 0,1 mm/h ger regn/snö (lätt < 0,5, annars
     < 2, kraftigt ≥ 2 mm/h; snö vid snöandel ≥ 50 %, snöblandat 20–50 %). Annars från molntäcke:
     < 20 % klart, < 45 % mest klart, < 70 % halvklart, < 90 % mestadels molnigt, annars mulet.
   - Dagens symbol: regn/snö om dygnssumman ≥ 0,5 mm, annars molntäcket 06–18.
   - Sol upp/ned är BERÄKNAD (astronomisk formel utifrån plats och datum, ca ±2 min), inte hämtad.
   - Känns som = vindkyla (kanadensiska formeln), bara vid ≤ 10 °C och ≥ 1,3 m/s medelvind.
   ===================================================================== */
const mean = (a) => { const v = a.filter((x) => x != null); return v.length ? v.reduce((p, q) => p + q, 0) / v.length : null; };
const deg = (v) => v == null ? '–' : String(Math.round(v)).replace('-', '−') + '°';

// En samlad timme av de källor som har data (null om ingen källa har det)
function combine(r) {
  const ids = Object.keys(SOURCES).filter((id) => r.s[id]);
  if (!ids.length) return null;
  const hs = ids.map((id) => r.s[id]);
  const wet = hs.filter((h) => h.precip != null && h.precip >= 0.1 && h.snow != null);
  return {
    t: r.t, ids,
    temp: mean(hs.map((h) => h.temp)), precip: mean(hs.map((h) => h.precip)),
    wind: mean(hs.map((h) => h.wind)), gust: mean(hs.map((h) => h.gust)), dir: meanDeg(hs.map((h) => h.dir)), cloud: mean(hs.map((h) => h.cloud)),
    snow: wet.length ? mean(wet.map((h) => h.snow)) : null,
    coarse: hs.every((h) => h.coarse),   // kursivt bara om ingen källa har finare tidssteg
  };
}
// ----- Delad väderklassificering: EN källa till sanning för text, symbol och bild -----
// c = {precip (mm/h), snow (0-1 eller null), cloud (%)}. Returnerar
//   key:   clear | partly | cloud | rain | sleet | snow | unknown
//   cover: molnighet för bilden: clear | few | half | mostly | overcast ('' vid okänt)
//   lvl:   nederbördsstyrka 0-3 (0 = torrt)
//   label: svensk text ('' när data saknas -> neutral bild, ingen text)
// Regn/snö avgörs bara av nederbörd + snöandel, aldrig av temperatur.
function classify(c) {
  const p = c.precip, sn = c.snow;
  if (p != null && p >= 0.1) {
    const lvl = p < 0.5 ? 1 : p < 2 ? 2 : 3;
    if (sn != null && sn >= 0.5) return { key: 'snow', cover: 'overcast', lvl, label: ['Lätt snöfall', 'Snöfall', 'Kraftigt snöfall'][lvl - 1] };
    if (sn != null && sn >= 0.2) return { key: 'sleet', cover: 'overcast', lvl, label: 'Snöblandat regn' };
    // okänd nederbördstyp (snow == null): rita regn men skriv bara "nederbörd"
    return { key: 'rain', cover: 'overcast', lvl, label: (sn == null ? ['Lätt nederbörd', 'Nederbörd', 'Kraftig nederbörd'] : ['Lätt regn', 'Regn', 'Kraftigt regn'])[lvl - 1] };
  }
  const k = c.cloud;
  if (k == null) return { key: 'unknown', cover: '', lvl: 0, label: '' };   // neutral reserv, aldrig solsken
  if (k < 20) return { key: 'clear', cover: 'clear', lvl: 0, label: 'Klart' };
  if (k < 45) return { key: 'partly', cover: 'few', lvl: 0, label: 'Mest klart' };
  if (k < 70) return { key: 'partly', cover: 'half', lvl: 0, label: 'Halvklart' };
  if (k < 90) return { key: 'cloud', cover: 'mostly', lvl: 0, label: 'Mestadels molnigt' };
  return { key: 'cloud', cover: 'overcast', lvl: 0, label: 'Mulet' };
}
const describe = (c, night) => Object.assign(classify(c), { night: !!night });
// Dagens symbol i veckolistan: nederbörd om dygnet ger minst 0,5 mm, annars molnighet 06-18. Aldrig natt.
function daySymbol(day, a) {
  const cs = day.hours.map(combine).filter(Boolean);
  const dayHrs = cs.filter((c) => { const h = localParts(c.t).hour; return h >= 6 && h < 18; });
  const cloud = mean((dayHrs.length ? dayHrs : cs).map((c) => c.cloud));
  if (a && a.rain != null && a.rain >= 0.5) {
    const wet = cs.filter((c) => c.precip != null && c.precip >= 0.1), known = wet.filter((c) => c.snow != null);
    return describe({ precip: wet.length ? mean(wet.map((c) => c.precip)) : 0.5, snow: known.length ? mean(known.map((c) => c.snow)) : null, cloud }, false);
  }
  return describe({ precip: 0, cloud }, false);
}
const windWord = (v) => v == null ? '' : v < 4 ? 'Svag vind' : v < 8 ? 'Måttlig vind' : v < 14 ? 'Frisk vind' : v < 21 ? 'Hård vind' : 'Storm';
const cloudWord = (p) => p == null ? '' : p < 20 ? 'Klart' : p < 45 ? 'Mest klart' : p < 70 ? 'Halvklart' : p < 90 ? 'Mestadels molnigt' : 'Mulet';

// Vindkyla (°C) eller null när formeln inte gäller. v i m/s -> km/h.
function windChill(T, v) {
  if (T == null || v == null || T > 10 || v < 1.3) return null;
  const k = Math.pow(v * 3.6, 0.16);
  return 13.12 + 0.6215 * T - 11.37 * k + 0.3965 * T * k;
}

// Soluppgång/solnedgång (ms UTC) för ett lokalt datum. Returnerar {rise,set} eller {rise:null,set:null,up}
function sunTimes(date, lat, lon) {
  const R = Math.PI / 180, jd = Date.parse(date + 'T12:00:00Z') / 864e5 + 2440587.5;
  const n = Math.round(jd - 2451545.0 + 0.0008), Js = n - lon / 360;      // lon: öst positiv
  const M = (357.5291 + 0.98560028 * Js) % 360;
  const C = 1.9148 * Math.sin(M * R) + 0.02 * Math.sin(2 * M * R) + 0.0003 * Math.sin(3 * M * R);
  const lam = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545.0 + Js + 0.0053 * Math.sin(M * R) - 0.0069 * Math.sin(2 * lam * R);
  const dec = Math.asin(Math.sin(lam * R) * Math.sin(23.4397 * R));
  const cw = (Math.sin(-0.833 * R) - Math.sin(lat * R) * Math.sin(dec)) / (Math.cos(lat * R) * Math.cos(dec));
  if (cw <= -1) return { rise: null, set: null, up: true };     // midnattssol
  if (cw >= 1) return { rise: null, set: null, up: false };     // polarnatt
  const w = Math.acos(cw) / R / 360, ms = (J) => (J - 2440587.5) * 864e5;
  return { rise: ms(Jt - w), set: ms(Jt + w), up: null };
}
function isNight(t) {
  const m = t + H / 2, s = sunTimes(localParts(t).date, state.loc.lat, state.loc.lon);
  if (s.rise == null) return s.up == null ? false : !s.up;           // midnattssol/polarnatt
  if (!isFinite(s.rise) || !isFinite(s.set)) return false;           // soltider saknas: anta dag
  return m < s.rise || m >= s.set;
}

// Temperaturfärg för staplarna i veckolistan (kallt blått -> grönt -> gult -> orange)
function tempColor(t) {
  const st = [[-8, [79, 134, 168]], [0, [110, 166, 198]], [8, [143, 185, 138]], [16, [238, 184, 46]], [26, [224, 138, 60]]];
  if (t <= st[0][0]) return `rgb(${st[0][1]})`;
  for (let i = 1; i < st.length; i++) if (t <= st[i][0]) {
    const f = (t - st[i - 1][0]) / (st[i][0] - st[i - 1][0]), a = st[i - 1][1], b = st[i][1];
    return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * f))})`;
  }
  return `rgb(${st[st.length - 1][1]})`;
}

// ----- Väderbilder (inline-SVG, mjuka platta former, inga externa filer) -----
// Gemensamma byggstenar: moln = rektangel + tre cirklar. Små ikoner (48x48) och sammanfattningsscenen delar formspråk.
const cloudG = (x, y, w, f) => `<g fill="${f}"><rect x="${x + .08 * w}" y="${y + .28 * w}" width="${.87 * w}" height="${.22 * w}" rx="${.11 * w}"/><circle cx="${x + .3 * w}" cy="${y + .3 * w}" r="${.2 * w}"/><circle cx="${x + .55 * w}" cy="${y + .22 * w}" r="${.26 * w}"/><circle cx="${x + .78 * w}" cy="${y + .32 * w}" r="${.17 * w}"/></g>`;
const moonG = (x, y, r, f, extra = '') => `<g transform="translate(${x} ${y}) rotate(-20)"><path d="M0 ${-r}A${r} ${r} 0 0 0 0 ${r}A${1.3 * r} ${1.3 * r} 0 0 1 0 ${-r}Z" fill="${f}" ${extra}/></g>`;
const isWet = (k) => k === 'rain' || k === 'snow' || k === 'sleet';

// Liten ikon (timremsa, veckolista, sammanfattningens rad). st = resultat från describe().
function wIcon(st, px) {
  const n = st.night, wet = isWet(st.key), cv = st.cover;
  const C = n ? ['#4a6572', '#6a8794'] : wet ? ['#7d95a2', '#a9bbc5'] : ['#8fa6b2', '#b9c9d1'];   // bak, fram
  const sun = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r * 1.45}" fill="#f2c24c" opacity=".28"/><circle cx="${x}" cy="${y}" r="${r}" fill="#f2c24c" stroke="#c99a22" stroke-width="1"/>`;
  const moon = (x, y, r) => moonG(x, y, r, '#ecd98f', 'stroke="#b59a40" stroke-width="1"');
  const lum = (x, y, r) => n ? moon(x, y, r) : sun(x, y, r);
  const rain = (xs) => xs.map((x) => `<path d="M${x} 36l-2.4 6" stroke="#4a86ad" stroke-width="2.4" stroke-linecap="round"/>`).join('');
  const flake = (xs) => xs.map((x, i) => `<circle cx="${x}" cy="${i % 2 ? 43 : 40}" r="2.2" fill="#fff" stroke="#4a86ad" stroke-width="1"/>`).join('');
  let g;
  if (st.key === 'unknown') g = `<path d="M13 34h22a7 7 0 0 0 1-13.9A10 10 0 0 0 17 19a8 8 0 0 0-4 15z" fill="none" stroke="#8fa6b2" stroke-width="2" stroke-dasharray="3 3"/>`;
  else if (cv === 'clear') g = lum(24, 24, n ? 11 : 10);
  else if (cv === 'few') g = lum(19, 18, 8) + cloudG(14, 20, 28, C[1]);
  else if (cv === 'half') g = lum(18, 17, 8) + cloudG(8, 18, 34, C[1]);
  else if (wet) g = cloudG(5, 4, 30, C[0]) + cloudG(11, 9, 32, C[1]) + (st.key === 'rain' ? rain([16, 24, 32]) : st.key === 'snow' ? flake([16, 24, 32]) : rain([16, 32]) + flake([24]));
  else g = cloudG(4, 8, 28, C[0]) + cloudG(10, 15, 34, C[1]);
  return `<svg viewBox="0 0 48 48" width="${px}" height="${px}" aria-hidden="true" focusable="false">${g}</svg>`;
}

// Sammanfattningens bakgrundsscen (400x240, förankrad till höger). Rent dekorativ: aria-hidden, inga klick.
// Varje scen får egna gradient-id:n (räknare) så att flera bilder aldrig krockar.
let wxUid = 0;
function wxScene(st) {
  const u = 'wx' + (++wxUid), n = st.night, wet = isWet(st.key), cv = st.cover;
  const P = n ? (wet ? ['#182f39', '#243d49', '#33505c'] : ['#1e3a46', '#2c4955', '#3d5b68']) : (wet ? ['#8da3ae', '#aebfc7', '#cdd9de'] : ['#b4c5cc', '#d0dce0', '#f6f9f7']);
  const cl = (x, y, w, f, dx, dur) => `<g class="drift" style="--dx:${dx}px;--t:${dur}s">${cloudG(x, y, w, f)}</g>`;
  const sun = (x, y, r) => `<circle class="glow" cx="${x}" cy="${y}" r="${r * 2}" fill="url(#${u}s)"/><circle cx="${x}" cy="${y}" r="${r}" fill="#f2c24c"/>`;
  const moon = (x, y, r) => `<circle class="glow" cx="${x}" cy="${y}" r="${r * 2}" fill="url(#${u}m)"/>` + moonG(x, y, r, '#ecd98f');
  const lum = (x, y, r) => n ? moon(x, y, r) : sun(x, y, r);
  const starAt = [[40, 30], [96, 70], [150, 22], [210, 56], [250, 20], [330, 40], [370, 90], [300, 150], [60, 130]];
  const nStars = n && !wet ? { clear: 9, few: 7, half: 5, mostly: 3, overcast: 0 }[cv] || 0 : 0;
  const stars = starAt.slice(0, nStars).map(([x, y], i) => `<circle class="tw" cx="${x}" cy="${y}" r="${i % 3 ? 1.4 : 2}" fill="#f1f5ef" style="--d:${-i * 0.7}s"/>`).join('');
  let g = '';
  if (st.key === 'unknown') g = `<g opacity=".45">${cloudG(200, 70, 170, '#fff')}</g>`;
  else if (cv === 'clear') g = lum(272, 112, 44);
  else if (cv === 'few') g = lum(280, 96, 40) + cl(196, 126, 130, P[2], 10, 16);
  else if (cv === 'half') g = lum(268, 86, 38) + cl(110, 98, 190, P[0], 14, 20) + cl(206, 120, 160, P[2], -12, 17);
  else if (wet) {
    const cnt = (k) => [0, 9, 13, 17][st.lvl] * (k === 'drop' ? 1 : 1) + (k === 'flake' ? 2 : 0);
    const nd = st.key === 'rain' ? cnt('drop') : st.key === 'sleet' ? 6 : 0, nf = st.key === 'snow' ? cnt('flake') : st.key === 'sleet' ? 7 : 0;
    const dc = n ? '#9cc3da' : '#4a86ad', pos = (i, m) => [140 + (i * 233 / m) % 240 + (i % 2) * 6, 150 + (i * 37) % 70];
    const drops = Array.from({ length: nd }, (_, i) => { const [x, y] = pos(i, nd); return `<line class="drop" x1="${x}" y1="${y}" x2="${x - 5}" y2="${y + 15}" stroke="${dc}" stroke-width="3" stroke-linecap="round" style="--d:${-(i * 0.37).toFixed(2)}s"/>`; }).join('');
    const flakes = Array.from({ length: nf }, (_, i) => { const [x, y] = pos(i + 3, nf); return `<circle class="flake" cx="${x}" cy="${y}" r="${i % 3 ? 3 : 4}" fill="#fff" stroke="${n ? '#9cc3da' : '#6c9fc0'}" stroke-width="1.2" style="--d:${-(i * 0.83).toFixed(2)}s"/>`; }).join('');
    g = cl(150, 26, 190, P[0], 12, 22) + cl(225, 40, 150, P[1], -10, 18) + drops + flakes + cl(172, 54, 184, P[2], 8, 20);
  } else if (cv === 'mostly') g = `<g opacity=".55">${lum(280, 80, 34)}</g>` + cl(110, 56, 200, P[0], 12, 22) + cl(200, 88, 170, P[1], -10, 18) + cl(126, 124, 190, P[2], 8, 20);
  else g = cl(110, 50, 200, P[0], 12, 22) + cl(200, 84, 170, P[1], -10, 18) + cl(126, 122, 190, P[2], 8, 20);
  return `<svg viewBox="0 0 400 240" preserveAspectRatio="xMaxYMid slice" aria-hidden="true" focusable="false"><defs>`
    + `<radialGradient id="${u}s"><stop offset="0" stop-color="#f7d46a" stop-opacity=".6"/><stop offset="1" stop-color="#f7d46a" stop-opacity="0"/></radialGradient>`
    + `<radialGradient id="${u}m"><stop offset="0" stop-color="#ecd98f" stop-opacity=".35"/><stop offset="1" stop-color="#ecd98f" stop-opacity="0"/></radialGradient></defs>${stars}${g}</svg>`;
}
// Bakgrundston för sammanfattningen
const toneOf = (st) => st.key === 'unknown' ? 'neutral' : st.night ? 'night' : ({ rain: 'rain', sleet: 'rain', snow: 'snow', cloud: 'cloud' }[st.key] || 'clear');

function pickHour(day) { // idag: aktuell timme, annars timmen närmast 12

function srcLine(c) { // vilka källor som ligger bakom värdena
  const names = (ids) => ids.map((id) => SOURCES[id].name).join(', ').replace(/, ([^,]*)$/, ' och $1');
  const used = c.ids, miss = Object.keys(SOURCES).filter((id) => !used.includes(id));
  let s = used.length > 1 ? `Kombinerad prognos: medelvärde av ${names(used)}.` : `Prognos från ${names(used)}.`;
  if (miss.length) s += ' ' + miss.map((id) => { const st = (state.src[id] || {}).status; return `${SOURCES[id].name} ${st === 'error' ? 'kunde inte hämtas' : st === 'loading' ? 'laddar' : 'saknar prognos för den här timmen'}`; }).join(', ') + '.';
  return s + ' Alla värden är prognoser, inga mätningar.';
}

// Kort källrad under temperaturen
function srcShort(c) {
  const all = Object.keys(SOURCES).length, n = c.ids.length;
  return n > 1 ? `Sammanvägd prognos · ${n === all ? n + ' källor' : n + ' av ' + all + ' källor'}` : `Prognos från ${SOURCES[c.ids[0]].name}`;
}

function renderWeather() {
  const el = $('viewWeather');
  const days = buildDays(0, 24);                        // hela dygnet, oberoende av Planeras tidsfilter
  if (!days.length) {
    const loading = Object.values(state.src).some((s) => s.status === 'loading');
    el.innerHTML = `<div class="wc"><h3>${loading ? 'Hämtar prognoser…' : 'Ingen prognos tillgänglig'}</h3>${loading ? '' : '<p class="sub">Kontrollera källorna längst ned och tryck på ↻.</p>'}</div>`;
